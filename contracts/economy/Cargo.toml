[package]
name = "pixelclimb-economy"
description = "Pixel Climb economy: round prize pool, best-floor runs and gem shop, paid in $PCMB"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/hsjtechnologies/play.pixelclimb.xyz"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
